services:
  # 1. FastAPI Web Service
  - type: web
    name: samadhan-setu-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: samadhan-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: samadhan-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: samadhan-setu-media

  # 2. Celery Background Worker Service
  - type: worker
    name: samadhan-setu-worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && celery -A celery_app.celery_worker worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: samadhan-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: samadhan-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 3. Managed Key-Value / Redis Service
  - type: keyvalue
    name: samadhan-redis
    plan: free
    ipAllowList: []

# Managed Databases
databases:
  - name: samadhan-postgres
    databaseName: samadhan_setu
    user: samadhan_user
    plan: free
